[workspace]
resolver = "3"
members = ["crates/ankura-core", "src-tauri"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
regex = "1.13"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned commit; not on crates.io and 0.7 is marked unstable (ADR 0008).
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", rev = "1c21940" }
thiserror = "2"
unicode-normalization = "0.1"
ureq = { version = "3.5", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
