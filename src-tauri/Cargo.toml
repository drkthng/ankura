[package]
name = "ankura"
description = "Ankura desktop app"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "ankura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
ankura-core = { path = "../crates/ankura-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
# API keys live in the OS keychain (ADR 0006): Windows Credential Manager, macOS Keychain, Secret Service.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
ureq.workspace = true
zip.workspace = true
